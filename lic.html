<!DOCTYPE html>
<html>
<body>

<button onclick="test()">Read Server</button>

<pre id="result"></pre>

<script>
async function test() {

    try {

        let r = await fetch("http://cdplc-cadm:2998/index.html");

        let t = await r.text();

        document.getElementById("result").textContent = t.substring(0,500);

    }
    catch(e){

        document.getElementById("result").textContent = e;

    }

}
</script>

</body>
</html>
