<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design Office Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b0f19; color: #e6edf3; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 1.0vh; height: 100vh; box-sizing: border-box; overflow: hidden; }
        .dashboard-grid { display: grid; grid-template-columns: 35% 20% 25% 20%; grid-template-rows: 33% 28% 33%; gap: 1.5vh; height: 100%; }
        .panel { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 2vh; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }

        .area-status { grid-column: 1; grid-row: 1; }
        .area-delay { grid-column: 2; grid-row: 1/ span 2; }
		.area-todaytomorrow { grid-column: 1; grid-row: 2; padding: 0.5vh; }
        .area-secwise { grid-column: 1; grid-row: 3; padding: 0.5vh; }
        .area-overallprogress { grid-column: 2; grid-row: 3; padding: 0.5vh; }
        .area-right { grid-column: 3; grid-row: 1 / span 3; background-color: transparent; border: none; padding: 0; }
        .area-clock { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 3vh 2vh; text-align: center; margin-bottom: 1.5vh; }
        .area-meetings { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 2vh; flex-grow: 1; }

        h2 { font-size: 3vh; margin: 0 0 1.5vh 0; color: #58a6ff; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        h3 { font-size: 1.5vh; margin: 0 0 1.5vh 0; color: #008000; text-transform: uppercase; letter-spacing: .8px; text-align: center; }
        .area-secwise h2, .area-overallprogress h2 { margin: 0.4vh 0; }
        .area-secwise h3 { margin: 0 0 0.4vh 0; }
        .sub-header { font-size: 2.2vh; color: #8b949e; text-align: center; margin-bottom: 1vh; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 1.2vh; }
        th, td { text-align: center; padding: 0.3vh; font-size: 2.5vh; font-weight: bold; border: 1px solid #30363d; }
        th { background-color: #21262d; color: #c9d1d9; }
        .col-caption { text-align: left; width: 40%; }

        .area-status h2 { margin-bottom: 0.6vh; }
        .area-status table { margin-bottom: 0.6vh; }
        .area-status th, .area-status td { padding: 0.15vh; font-size: 2vh; }
        .area-status .sub-header { margin-bottom: 0.3vh; }

        .bg-white { background-color: #ffffff; color: #000000; }
        .bg-pale { background-color: #E6E6FA; color: #000000; }
        .bg-blue { background-color: #00B0F0; color: #ffffff; }
        .bg-yellow { background-color: #FFFF00; color: #000000; }
        .bg-orange { background-color: #FFC000; color: #000000; }
        .bg-green { background-color: #2ea043; color: #ffffff; }
        .bg-red { background-color: #FF0000; color: #ffffff; }

        .today-count-row { display: flex; justify-content: space-between; gap: 1vh; margin-top: 0.5vh; }
        .today-count-box { flex: 1; background-color: #21262d; border: 1px solid #30363d; border-radius: 6px; text-align: center; padding: 0.3vh; overflow: hidden; }
        .today-count-box .tc-section { font-size: 1.6vh; color: #e6edf3; letter-spacing: 0.5px; margin-bottom: 0.3vh; font-weight: 600; }
        .tc-days { display: flex; gap: 0.3vh; }
        .tc-day { flex: 1; display: flex; flex-direction: column; gap: 0.25vh; min-width: 0; }
        .tc-day-label { font-size: 1vh; color: #8b949e; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; margin-bottom: 0.1vh; height: 1.5vh; display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .today-count-box .tc-tier { border-radius: 4px; padding: 0.2vh 0; }
        .today-count-box .tc-label { font-size: 1.05vh; letter-spacing: 0.2px; font-weight: 500; }
        .today-count-box .tc-value { font-size: 2.1vh; font-weight: 600; line-height: 1.1; }
        .today-count-box .tc-scheduled { background-color: #FFC000; }
        .today-count-box .tc-scheduled .tc-label, .today-count-box .tc-scheduled .tc-value { color: #000000; }
        .today-count-box .tc-issued { background-color: #2ea043; }
        .today-count-box .tc-issued .tc-label, .today-count-box .tc-issued .tc-value { color: #ffffff; }
        .today-count-box .tc-tomorrow-sched { background-color: #58a6ff; }
        .today-count-box .tc-tomorrow-sched .tc-label, .today-count-box .tc-tomorrow-sched .tc-value { color: #000000; }
        .today-count-box .tc-tomorrow-issued { background-color: #2ea043; }
        .today-count-box .tc-tomorrow-issued .tc-label, .today-count-box .tc-tomorrow-issued .tc-value { color: #ffffff; }
        .today-count-box .tc-week-sched { background-color: #a371f7; }
        .today-count-box .tc-week-sched .tc-label, .today-count-box .tc-week-sched .tc-value { color: #000000; }
        .today-count-box .tc-week-issued { background-color: #2ea043; }
        .today-count-box .tc-week-issued .tc-label, .today-count-box .tc-week-issued .tc-value { color: #ffffff; }
        .tc-total-row { display: flex; gap: 0.3vh; margin-top: 0.35vh; padding-top: 0.35vh; border-top: 1px solid #30363d; }
        .tc-total-row .tc-tier { flex: 1; min-width: 0; background-color: #1f6f78; }
        .tc-total-row .tc-label, .tc-total-row .tc-value { color: #ffffff; }
        .tc-total-row .tc-day-label { color: #7fd7de; }

        .charts-container { display: flex; justify-content: space-around; flex-grow: 1; align-items: center; padding-top: 0; }
        .charts-container1 { display: flex; justify-content: space-around; flex-grow: 1; align-items: stretch; padding-top: 0; }
        .chart-wrapper { width: 18%; display: flex; flex-direction: column; align-items: center; }
        .chart-label { text-align: center; font-size: 2.5vh; margin-bottom: 0.3vh; color: #8b949e; font-weight: bold; }
        .charts-container1 .chart-wrapper { width: auto; height: 80%; }

        /* Fixed Aspect Ratio Container to prevent sheering */
        .canvas-container { position: relative; width: 100%; aspect-ratio: 1 / 1; display: flex; justify-content: center; }
        .canvas-container1 { position: relative; height: 100%; aspect-ratio: 1 / 1; display: flex; justify-content: center; }

        .dynamic-list { font-size: 1.8vh; line-height: 1.6; color: #e6edf3; overflow: hidden; }
        .page-indicator { text-align: right; font-size: 1.8vh; color: #8b949e; font-style: italic; margin-bottom: 1vh; }
        #time-display { font-size: 10vh; font-weight: lighter; color: #ffffff; margin: 0; line-height: 1; letter-spacing: 2px;}
        #date-display { font-size: 2.5vh; color: #58a6ff; margin-top: 1vh; }
        .meeting-item { background-color: #21262d; padding: 1.5vh; margin-bottom: 1.5vh; border-radius: 4px; border-left: 4px solid #a371f7; }
        .meeting-time { font-weight: bold; color: #a371f7; font-size: 2.2vh; }
        .meeting-title { font-size: 1.8vh; margin-top: 0.5vh; }

        /* ===== Mobile layout ====== */
        @media (max-width: 820px) {
            body { height: auto; min-height: 100vh; overflow-y: auto; padding: 3vw; }
            .dashboard-grid { display: flex; flex-direction: column; height: auto; gap: 3vw; }
            .panel, .area-right { grid-column: auto; grid-row: auto; }
            .panel { overflow: visible; padding: 4vw; }
            .area-secwise, .area-overallprogress { padding: 3vw; }

            h2 { font-size: 5.5vw; margin-bottom: 2vw; }
            h3 { font-size: 3vw; margin-bottom: 2vw; }
            .area-secwise h2, .area-overallprogress h2 { margin: 1vw 0; }
            .area-secwise h3 { margin: 0 0 1.5vw 0; }
            .sub-header { font-size: 4vw; margin-bottom: 2vw; }

            table { margin-bottom: 2vw; }
            th, td { font-size: 3.6vw; padding: 1.2vw; }
            .area-status h2 { margin-bottom: 2vw; }
            .area-status table { margin-bottom: 2vw; }
            .area-status th, .area-status td { font-size: 3vw; padding: 1vw; }
            .area-status .sub-header { margin-bottom: 1.5vw; }

            .today-count-row { flex-wrap: wrap; gap: 2vw; }
            .today-count-box { flex: 1 1 100%; padding: 2vw; }
            .today-count-box .tc-section { font-size: 4vw; margin-bottom: 1.5vw; }
            .tc-day-label { font-size: 2.4vw; height: 3.2vw; }
            .today-count-box .tc-label { font-size: 2.6vw; }
            .today-count-box .tc-value { font-size: 5vw; }
            .tc-days { gap: 1.5vw; }
            .today-count-box .tc-tier { padding: 1vw 0; }
            .tc-total-row { gap: 1.5vw; margin-top: 2vw; padding-top: 2vw; }

            .charts-container { flex-wrap: wrap; row-gap: 3vw; }
            .chart-wrapper { width: 30%; }
            .chart-label { font-size: 3.4vw; margin-bottom: 1vw; }

            .charts-container1 { padding: 2vw 0; }
            .charts-container1 .chart-wrapper { width: 60%; height: auto; }
            .canvas-container1 { height: auto; }

            .area-right { display: flex; flex-direction: column; }
            .area-clock { display: none; }
            .area-meetings, .area-s { padding: 4vw; }
            .meeting-item { padding: 3vw; margin-bottom: 2.5vw; }
            .meeting-time { font-size: 4vw; }
            .meeting-title { font-size: 3.4vw; margin-top: 1vw; }

            .dynamic-list { font-size: 3.6vw; }
            .page-indicator { font-size: 3vw; }
        }
    </style>
</head>
<body>
    <div class="dashboard-grid">
        <div class="panel area-status">
            <h2>Drawing Status - REV A</h2>
            <table>
                <thead>
                    <tr><th class="col-caption">Status</th><th>HULL</th><th>SOF</th><th>AOF</th><th>MOF</th><th>EOF</th><th style="background-color: #21262d; border-left: 2px solid #0b0f19;">TOTAL</th></tr>
                </thead>
                <tbody id="status-table-body"></tbody>
            </table>
        </div>
		<div class="panel area-todaytomorrow" >
			 <!--div class="sub-header" style="margin-bottom: 0.5vh;">Today &amp; Tomorrow's Target Drawings</div--!>
			<h2>Today, Tomorrow &amp; This Week's Target Drawings</h2>
            <div id="today-count-row" class="today-count-row"></div>
		</div>	
		
        <div class="panel area-delay">
            <h2>Delayed Drawings </h2>
            <div id="delay-header" class="sub-header">Loading...
				<div id="delay-count"></div>
			</div>
            <div id="delay-page" class="page-indicator"></div>
            <div id="delay-list" class="dynamic-list"></div>
        </div>
        <div class="panel area-secwise">
			<h2> Section-wise Progress</h2>
			<h3> (Green - Issued) </h3>
            <div class="charts-container">
                <div class="chart-wrapper"><div class="chart-label">HULL</div><div class="canvas-container"><canvas id="chart-Hull"></canvas></div></div>
                <div class="chart-wrapper"><div class="chart-label">SOF</div><div class="canvas-container"><canvas id="chart-SOF"></canvas></div></div>
                <div class="chart-wrapper"><div class="chart-label">AOF</div><div class="canvas-container"><canvas id="chart-AOF"></canvas></div></div>
                <div class="chart-wrapper"><div class="chart-label">MOF</div><div class="canvas-container"><canvas id="chart-MOF"></canvas></div></div>
                <div class="chart-wrapper"><div class="chart-label">EOF</div><div class="canvas-container"><canvas id="chart-EOF"></canvas></div></div>
            </div>
        </div>
        <div class="panel area-overallprogress">
            <h2>Overall Progress</h2>
            <div class="charts-container1">
                <div class="chart-wrapper">
					<div class="chart-label">Overall</div>
					<div class="canvas-container1">
						<canvas id="chart-Overall"></canvas>
					</div>
				</div>
			</div>
        </div>
        <div class="area-right" style="display: flex; flex-direction: column;">
            <div class="area-clock"><div id="time-display">00:00</div><div id="date-display">Day, Month 00</div></div>
            <div class="panel area-s">
                <h2>Today's Schedules</h2>
                <div class="-item"><div class="meeting-time"></div><div class="meeting-title"></div></div>
                <div class="meeting-item"><div class="meeting-time">  </div><div class="meeting-title">...</div></div>
                <div class="meeting-item"><div class="meeting-time"> </div><div class="meeting-title">...</div></div>
				<div class="meeting-item"><div class="meeting-time"> </div><div class="meeting-title"> ...</div></div>
            </div>
        </div>
    </div>

    <script>
        const baseUrl = './'; 
        const sections = ['Hull', 'SOF', 'AOF', 'MOF', 'EOF'];
        const chartInstances = {}; 
		const dataMap = {};
		
		let chartInstancesOA;
		let chartInstances1;
		let GrandTotal = 0;
		let GrandIssue = 0;
		let OAPercentage;
		let chartData1;

        function updateClock() {
            const now = new Date();
            let hours = now.getHours() % 12 || 12;
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('time-display').innerText = `${hours}:${minutes}`;
            document.getElementById('date-display').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();
const centerTextPlugin = {
    id: 'centerText',

    afterDraw(chart) {

        const { ctx } = chart;

        const centerX =
            chart.getDatasetMeta(0).data[0].x;

        const centerY =
            chart.getDatasetMeta(0).data[0].y;

        const percentage =
            chart.config.options.plugins.centerText.percentage;

        ctx.save();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 50px Segoe UI';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillText(
            percentage + '%',
            centerX,
            centerY
        );

        ctx.restore();
    }
};

Chart.register(centerTextPlugin);
        async function fetchAllStatus() {
		GrandTotal = 0;
		GrandIssue = 0;
			
            const tableBody = document.getElementById('status-table-body');
            
            await Promise.all(sections.map(async (sec) => {
                try {
                    const res = await fetch(`${baseUrl}${sec}ToDisplay.json?t=${new Date().getTime()}`);
                    dataMap[sec] = res.ok ? await res.json() : {};
                } catch { dataMap[sec] = {}; }
            }));

            const rows = [
                { key: '1', label: 'Total Drawings ', css: 'bg-white' },
				{ key: '6', label: 'Inprogrss Drawings ', css: 'bg-pale' },
                { key: '2', label: 'Forwarded for Checking', css: 'bg-blue' },
                { key: '3', label: 'Checked, Not Approved', css: 'bg-yellow' },
                { key: '4', label: 'Approved, To be issued', css: 'bg-orange' },
                { key: '5', label: 'Issued', css: 'bg-green' },
                { key: '6', label: 'Current Delay', css: 'bg-red' }
            ];

            let html = '';
            rows.forEach(row => {
                let rowHtml = `<tr><td class="col-caption ${row.css}">${row.label}</td>`;
                let rowTotal = 0;
                sections.forEach(sec => {
                    let val = parseInt(dataMap[sec][row.key] || 0);
                    rowTotal += val;
                    rowHtml += `<td class="${row.css}">${val}</td>`;
                });
                rowHtml += `<td class="${row.css}" style="border-left: 2px solid #0b0f19;">${rowTotal}</td></tr>`;
                html += rowHtml;
            });
            tableBody.innerHTML = html;

            sections.forEach(sec => {
                const issued = parseInt(dataMap[sec]['5'] || 0);
                const progress = parseInt(dataMap[sec]['1'] || 0) - parseInt(dataMap[sec]['5'] || 0) ;
                const total = issued + progress;
				GrandTotal += total;
				GrandIssue += issued;
				
				OAPercentage = 
					GrandTotal > 0
        			? Math.round((GrandIssue / GrandTotal) * 100)
        			: 0;

				const percentage =
    				total > 0
        			? Math.round((issued / total) * 100)
        			: 0;
				

				                const chartData = total > 0 ? [issued, progress] : [1];
								 chartData1 = [GrandIssue,GrandTotal-GrandIssue];
												
                const chartColors = total > 0 ? ['#2ea043', '#E1E4E8'] : ['#30363d'];

                if(!chartInstances[sec] && typeof Chart !== 'undefined') {
                    const ctx = document.getElementById(`chart-${sec}`).getContext('2d');
                    chartInstances[sec] = new Chart(ctx, {
                        type: 'doughnut',
                        data: { datasets: [{ data: chartData, backgroundColor: chartColors, borderWidth: 0 }] },
                        options: {
   							responsive: true,
    						maintainAspectRatio: true,
    						cutout: '75%',
    						plugins: {
        						legend: {
            						display: false
        							},
        						centerText: {
            						percentage: percentage
        										}
    										}
										}
                    });
                } else if(chartInstances[sec]) {
                    chartInstances[sec].data.datasets[0].data = chartData;
                    chartInstances[sec].data.datasets[0].backgroundColor = chartColors;
					chartInstances[sec].options.plugins.centerText.percentage = percentage;
                    chartInstances[sec].update();
                }
				
            });
					const chartColors1 = GrandTotal > 0 ? ['#2ea043', '#E1E4E8'] : ['#30363d'];
					if(!chartInstances1 && typeof Chart !== 'undefined') {
					const ctx1 = document.getElementById("chart-Overall").getContext('2d');
			        chartInstances1 = new Chart(ctx1, {
                        type: 'doughnut',
                        data: { datasets: [{ data: chartData1, backgroundColor: chartColors1, borderWidth: 0 }] },
                        options: {
   							responsive: true,
    						maintainAspectRatio: true,
    						cutout: '75%',
    						plugins: {
        						legend: {
            						display: false
        							},
        						centerText: {
            						percentage: OAPercentage 
        										}
    										}
										}
                    });	
					 }
					
        }

        // Counts today's, tomorrow's, and this week's (Mon-Sun) target-dated drawings per section
        async function fetchTodayCounts() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);

            const toDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const todayStr = toDateStr(now);
            const tomorrowStr = toDateStr(tomorrow);

            // Current week = Monday through Sunday, including days already passed
            const dayOfWeek = now.getDay(); // 0 = Sunday, 1 = Monday, ...
            const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const monday = new Date(now);
            monday.setDate(monday.getDate() + diffToMonday);
            monday.setHours(0, 0, 0, 0);
            const sunday = new Date(monday);
            sunday.setDate(sunday.getDate() + 6);
            sunday.setHours(0, 0, 0, 0);

            const counts = {};
            await Promise.all(sections.map(async (sec) => {
                try {
                    const res = await fetch(`${baseUrl}${sec}Drawings.json?t=${new Date().getTime()}`);
                    const rawData = res.ok ? await res.json() : {};
                    const all = Object.values(rawData);

                    const todayArr = all.filter(item => item.Target_Date === todayStr);
                    const todayIssued = todayArr.filter(item => item.Issue_Date && item.Issue_Date !== "").length;

                    const tomorrowArr = all.filter(item => item.Target_Date === tomorrowStr);
                    const tomorrowIssued = tomorrowArr.filter(item => item.Issue_Date && item.Issue_Date !== "").length;

                    const weekArr = all.filter(item => {
                        if (!item.Target_Date) return false;
                        const d = new Date(item.Target_Date);
                        d.setHours(0, 0, 0, 0);
                        return d >= monday && d <= sunday;
                    });
                    const weekIssued = weekArr.filter(item => item.Issue_Date && item.Issue_Date !== "").length;

                    // Actual output: grouped by Issue_Date, not Target_Date - captures backlog items issued today/this week
                    const totalIssuedToday = all.filter(item => item.Issue_Date === todayStr).length;
                    const totalIssuedWeek = all.filter(item => {
                        if (!item.Issue_Date || item.Issue_Date === "") return false;
                        const d = new Date(item.Issue_Date);
                        d.setHours(0, 0, 0, 0);
                        return d >= monday && d <= sunday;
                    }).length;

                    counts[sec] = {
                        todayScheduled: todayArr.length, todayIssued,
                        tomorrowScheduled: tomorrowArr.length, tomorrowIssued,
                        weekScheduled: weekArr.length, weekIssued,
                        totalIssuedToday, totalIssuedWeek
                    };
                } catch {
                    counts[sec] = { todayScheduled: 0, todayIssued: 0, tomorrowScheduled: 0, tomorrowIssued: 0, weekScheduled: 0, weekIssued: 0, totalIssuedToday: 0, totalIssuedWeek: 0 };
                }
            }));

            const row = document.getElementById('today-count-row');
            row.innerHTML = sections.map(sec => `
                <div class="today-count-box">
                    <div class="tc-section">${sec}</div>
                    <div class="tc-days">
                        <div class="tc-day">
                            <div class="tc-day-label">Today</div>
                            <div class="tc-tier tc-scheduled">
                                <div class="tc-label">Sched</div>
                                <div class="tc-value">${counts[sec].todayScheduled}</div>
                            </div>
                            <div class="tc-tier tc-issued">
                                <div class="tc-label">Issued</div>
                                <div class="tc-value">${counts[sec].todayIssued}</div>
                            </div>
                        </div>
                        <div class="tc-day">
                            <div class="tc-day-label">Tomorrow</div>
                            <div class="tc-tier tc-tomorrow-sched">
                                <div class="tc-label">Sched</div>
                                <div class="tc-value">${counts[sec].tomorrowScheduled}</div>
                            </div>
                            <div class="tc-tier tc-tomorrow-issued">
                                <div class="tc-label">Issued</div>
                                <div class="tc-value">${counts[sec].tomorrowIssued}</div>
                            </div>
                        </div>
                        <div class="tc-day">
                            <div class="tc-day-label">This Week</div>
                            <div class="tc-tier tc-week-sched">
                                <div class="tc-label">Sched</div>
                                <div class="tc-value">${counts[sec].weekScheduled}</div>
                            </div>
                            <div class="tc-tier tc-week-issued">
                                <div class="tc-label">Issued</div>
                                <div class="tc-value">${counts[sec].weekIssued}</div>
                            </div>
                        </div>
                    </div>
                    <div class="tc-total-row">
                        <div class="tc-tier">
                            <div class="tc-day-label">Issued Today</div>
                            <div class="tc-value">${counts[sec].totalIssuedToday}</div>
                        </div>
                        <div class="tc-tier">
                            <div class="tc-day-label">Issued this Week</div>
                            <div class="tc-value">${counts[sec].totalIssuedWeek}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

    class Rotator {
      constructor(fileSuffix, titlePrefix, listId, headerId, pageId, isDateFiltered, isDelayPanel = false) {

    this.fileSuffix = fileSuffix;
    this.titlePrefix = titlePrefix;
    this.listId = listId;
    this.headerId = headerId;
    this.pageId = pageId;

    this.isDateFiltered = isDateFiltered;
    this.isDelayPanel = isDelayPanel;

    this.secIndex = 0;
    this.pageIndex = 0;
    this.itemsPerPage = 5;
    this.currentData = [];
}
            async tick() {
                if (this.currentData.length === 0 || this.pageIndex >= Math.ceil(this.currentData.length / this.itemsPerPage)) {
                    this.secIndex = (this.secIndex + 1) % sections.length;
                    await this.fetchData(sections[this.secIndex]);
                    this.pageIndex = 0;
                }
                this.renderPage(); this.pageIndex++;
            }
            async fetchData(section) {
                document.getElementById(this.headerId).innerText = `${section} - FETCHING...`;
                try {
                    const res = await fetch(`${baseUrl}${section}${this.fileSuffix}.json?t=${new Date().getTime()}`);
                   const rawData = await res.json();

			let arr = Object.keys(rawData).map(key => {
    			return {
       			 dwg: key,
        		...rawData[key]
    				};
			});

		if (this.isDelayPanel) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    arr = arr.filter(item => {
        if (!item.Target_Date)
            return false;
		if (item.rev && item.rev.trim().toLowerCase() === 'cancelled')
            return false;

        const targetDate = new Date(item.Target_Date);
        targetDate.setHours(0, 0, 0, 0);
        return (
            item.Issue_Date === "" &&
            targetDate < today
        );
    });
}	
if (this.isDateFiltered) {

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const localTodayStr =
        `${year}-${month}-${day}`;

    arr = arr.filter(item =>
        item.Issue_Date === localTodayStr
    );
}
	this.currentData = arr;
if (this.isDelayPanel) {
document.getElementById(this.headerId).innerHTML =
    `${section} - ${this.titlePrefix}
    <span style="
        color:#FF0000;
        font-size:1.2em;
        font-weight:bold;
    ">
        [${arr.length}]
    </span>`;
} else {
    document.getElementById(this.headerId).innerText =
        section + ': ' + this.titlePrefix;
}

} catch (e) {
    this.currentData = [];
}


}
            renderPage() {
                const totalPages = Math.max(1, Math.ceil(this.currentData.length / this.itemsPerPage));
                const chunk = this.currentData.slice(this.pageIndex * this.itemsPerPage, (this.pageIndex + 1) * this.itemsPerPage);
                document.getElementById(this.pageId).innerText = `Page ${this.pageIndex + 1} of ${totalPages}`;
                document.getElementById(this.listId).innerHTML = chunk.length ? chunk.map(i => `<div style="margin-bottom:1vh; border-bottom:1px solid #30363d;"><b>${i.drgNum}</b><br><small>${i.Drawing_Name || i.Target_Date}</small></div>`).join('') : 'No Drawings  to display here...';
            }
        }

       	const delayRotator = new Rotator('Drawings','DELAYED DRAWINGS','delay-list','delay-header','delay-page', false,true);
        //const todayRotator = new Rotator('Drawings', 'TODAY', 'today-list', 'today-header', 'today-page', true);

        fetchAllStatus();
        fetchTodayCounts();
        setInterval(fetchAllStatus, 30000);
        setInterval(fetchTodayCounts, 30000);
        async function init() {
            await delayRotator.fetchData(sections[0]);
           // await todayRotator.fetchData(sections[0]);
            delayRotator.tick(); //todayRotator.tick();
            setInterval(() => delayRotator.tick(), 8000);
           // setInterval(() => todayRotator.tick(), 8000);
		setInterval(async () => { await delayRotator.fetchData( sections[delayRotator.secIndex]);}, 60000);
        }
        init();
    </script>
</body>
</html>
