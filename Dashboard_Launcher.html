<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NC-0263 Dashboard Launcher</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body { display:flex; align-items:center; justify-content:center; background:#fff; color:#222; font-family:Arial,sans-serif; }
#launcher { text-align:center; padding:20px; }
h1 { margin:0 0 16px; font-size:24px; font-weight:600; }
button { padding:8px 16px; border:1px solid #999; border-radius:3px; background:#eee; color:#222; font-size:14px; cursor:pointer; }
button:focus { outline:2px solid #555; outline-offset:2px; }
#message { min-height:20px; margin-top:12px; font-size:13px; color:#b00020; }
#dashboard { display:none; position:fixed; inset:0; width:100%; height:100%; border:0; background:#0b0f19; }
body.dashboard-active #launcher { display:none; }
body.dashboard-active #dashboard { display:block; }
</style>
</head>
<body>
<main id="launcher">
  <h1>NC-0263 LIVE DASHBOARD</h1>
  <button id="launch" type="button">Launch Dashboard</button>
  <div id="message" role="status"></div>
</main>
<iframe id="dashboard" title="NC-0263 Live Dashboard"></iframe>
<script>
const launchButton = document.getElementById('launch');
const dashboard = document.getElementById('dashboard');
const message = document.getElementById('message');

launchButton.addEventListener('click', async () => {
  message.textContent = '';
  dashboard.src = './DashboardTV1.html';
  document.body.classList.add('dashboard-active');
  try {
    if (!document.documentElement.requestFullscreen) throw new Error('Fullscreen unavailable');
    await document.documentElement.requestFullscreen();
  } catch (error) {
    message.textContent = 'Full Screen Fail!';
    document.body.classList.remove('dashboard-active');
    dashboard.src = 'about:blank';
  }
});

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    document.body.classList.remove('dashboard-active');
    dashboard.src = 'about:blank';
    message.textContent = '';
  }
});
</script>
</body>
</html>
